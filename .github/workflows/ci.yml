name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'feature/issue-')
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'feature/issue-')
        run: npm ci

      - name: Build and test library
        if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'feature/issue-')
        run: npm run build

      - name: Build Docker image
        run: docker build --tag roostr:ci .
